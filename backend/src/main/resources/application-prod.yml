spring:
  config:
    activate:
      on-profile: prod

  # Database Configuration for Supabase
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # Kafka Configuration for Upstash Serverless Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";
    consumer:
      group-id: flowforge-workers
      auto-offset-reset: earliest
      enable-auto-commit: false # Manual acknowledgements for reliability
    producer:
      acks: all # Highest reliability
      retries: 3
    listener:
      ack-mode: manual_immediate

  # Redis Configuration for Upstash
  data:
    redis:
      url: ${REDIS_URL}

logging:
  level:
    root: INFO
    com.flowforge: INFO
